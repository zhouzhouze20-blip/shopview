<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
    <link rel="stylesheet" href="/src/index.css" />
    <title>ShopView 手机销售筛选预览</title>
  </head>
  <body>
    <main class="min-h-[100dvh] bg-slate-100 pb-4 text-slate-900">
      <header class="sticky top-0 z-20 bg-gradient-to-br from-slate-950 via-slate-900 to-teal-950 px-3 pb-2.5 pt-2.5 text-white shadow-md">
        <div class="flex items-center justify-between gap-2">
          <div class="flex min-w-0 items-center gap-2">
            <button class="h-8 w-8 shrink-0 rounded-full text-lg">←</button>
            <div class="min-w-0">
              <div class="text-[9px] font-medium tracking-[.14em] text-teal-200">SHOPVIEW</div>
              <h1 class="truncate text-base font-semibold">销售看板</h1>
            </div>
          </div>
          <button class="h-8 w-8 shrink-0 rounded-full text-lg">↗</button>
        </div>
        <div class="mt-1 flex items-center justify-between gap-3 text-[10px] text-slate-300">
          <span>周辰</span><span>2026-08-02 至 2026-08-02</span>
        </div>
      </header>

      <div class="mx-auto max-w-xl space-y-2 px-2.5 pt-2.5">
        <div class="overflow-hidden rounded-xl border border-slate-200/80 bg-white shadow-sm">
          <div class="grid grid-cols-2 divide-x divide-slate-100">
            <div class="min-w-0 px-3 py-2.5">
              <div class="text-[10px] leading-4 text-slate-500">销售收入</div>
              <div id="sales-total" class="whitespace-nowrap text-lg font-semibold leading-6 tabular-nums text-slate-950">¥1,832,640</div>
              <div class="mt-1 grid grid-cols-2 gap-2 text-[9px] leading-3 text-slate-400"><div>同期销售<br><span class="font-medium text-slate-600">¥1,765,820</span></div><div class="text-right">销售同比<br><span class="font-semibold text-red-600">+3.78%</span></div></div>
            </div>
            <div class="min-w-0 px-3 py-2.5">
              <div class="text-[10px] leading-4 text-slate-500">净毛利</div>
              <div id="profit-total" class="whitespace-nowrap text-lg font-semibold leading-6 tabular-nums text-slate-950">¥245,360</div>
              <div class="mt-1 grid grid-cols-2 gap-2 text-[9px] leading-3 text-slate-400"><div>同期毛利<br><span class="font-medium text-slate-600">¥230,490</span></div><div class="text-right">毛利同比<br><span class="font-semibold text-red-600">+6.45%</span></div></div>
            </div>
          </div>
        </div>

        <section>
          <div class="mb-2 flex min-h-8 items-center gap-2 px-0.5">
            <div class="grid h-8 w-8 shrink-0 place-items-center rounded-full bg-teal-100 text-teal-700">▥</div>
            <div class="flex min-w-0 flex-1 items-baseline gap-2">
              <h2 class="truncate text-sm font-semibold text-slate-950">门店销售汇总</h2>
              <div class="shrink-0 text-[10px] text-slate-400">4 项 · 权限范围</div>
            </div>
            <button id="toggle-sales" type="button" class="h-7 shrink-0 rounded-full border border-slate-200 bg-white px-2 text-[10px] text-teal-700 shadow-sm" aria-pressed="false">＋ 添加租赁/后台销售</button>
          </div>

          <div id="filter-note" class="mb-2 rounded-lg bg-teal-50 px-3 py-1.5 text-[10px] text-teal-700">当前默认：已去除租赁和后台部门销售</div>
          <div id="stores" class="space-y-1.5"></div>
        </section>
      </div>
    </main>

    <script>
      const stores = [
        ["常州购物中心", "1", "126.80万", "118.62万", "18.45万", "17.06万", "+6.90%", "14.55%", "816"],
        ["常州新世纪商城", "3", "38.74万", "36.04万", "4.96万", "4.62万", "+7.49%", "12.80%", "294"],
        ["常州百货大楼", "2", "13.28万", "12.66万", "1.52万", "1.34万", "+4.90%", "11.45%", "106"],
        ["常州半山书局", "4", "4.44万", "3.04万", "0.61万", "0.43万", "+46.05%", "13.74%", "51"],
      ];
      document.querySelector("#stores").innerHTML = stores.map(([name, code, sales, priorSales, profit, priorProfit, yoy, margin, tickets]) => `
        <article class="rounded-xl border border-slate-200 bg-white px-3 py-2.5 shadow-sm">
          <div class="flex items-center justify-between gap-2"><div class="flex min-w-0 items-baseline gap-2"><b class="truncate text-sm">${name}</b><span class="text-[10px] text-slate-400">${code}</span></div><span class="text-slate-300">›</span></div>
          <div class="mt-2 grid grid-cols-2 gap-2">
            <div class="rounded-lg bg-slate-50 px-2 py-1.5"><div class="text-[10px] text-slate-400">销售收入</div><div class="grid grid-cols-2 gap-1 text-[10px] text-slate-400"><span>本期 <b class="text-[11px] text-slate-950">${sales}</b></span><span class="text-right">同期 <b class="text-[11px] text-slate-600">${priorSales}</b></span></div></div>
            <div class="rounded-lg bg-slate-50 px-2 py-1.5"><div class="text-[10px] text-slate-400">净毛利</div><div class="grid grid-cols-2 gap-1 text-[10px] text-slate-400"><span>本期 <b class="text-[11px] text-slate-950">${profit}</b></span><span class="text-right">同期 <b class="text-[11px] text-slate-600">${priorProfit}</b></span></div></div>
          </div>
          <div class="mt-1.5 grid grid-cols-3 divide-x divide-slate-100 rounded-lg border border-slate-100 py-1 text-center text-[10px] leading-3 text-slate-400"><div>销售同比<br><b class="text-red-600">${yoy}</b></div><div>毛利率<br><b class="text-slate-700">${margin}</b></div><div>小票数<br><b class="text-slate-700">${tickets}</b></div></div>
        </article>`).join("");

      document.querySelector("#toggle-sales").addEventListener("click", (event) => {
        const button = event.currentTarget;
        const included = button.getAttribute("aria-pressed") !== "true";
        button.setAttribute("aria-pressed", String(included));
        button.textContent = included ? "去除租赁/后台销售" : "＋ 添加租赁/后台销售";
        document.querySelector("#filter-note").textContent = included ? "当前：已包含租赁和后台部门销售" : "当前默认：已去除租赁和后台部门销售";
        document.querySelector("#sales-total").textContent = included ? "¥1,946,280" : "¥1,832,640";
        document.querySelector("#profit-total").textContent = included ? "¥251,940" : "¥245,360";
      });
    </script>
  </body>
</html>

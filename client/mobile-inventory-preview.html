<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/index.css" />
    <title>ShopView 库存查询预览</title>
  </head>
  <body class="bg-slate-100">
    <main class="min-h-[100dvh] bg-slate-100 pb-6 text-slate-900">
      <header class="sticky top-0 z-20 border-b border-slate-800 bg-slate-950 px-4 pb-4 pt-3 text-white shadow-sm">
        <div class="mx-auto flex max-w-xl items-center gap-3">
          <button class="grid h-10 w-10 place-items-center rounded-full text-2xl text-white" aria-label="返回">←</button>
          <div>
            <div class="text-[10px] tracking-[0.16em] text-cyan-300">SHOPVIEW</div>
            <h1 class="text-lg font-semibold">库存查询</h1>
          </div>
        </div>
      </header>

      <div class="mx-auto max-w-xl space-y-3 px-4 pt-4">
        <div class="grid h-12 grid-cols-3 rounded-2xl bg-slate-200 p-1 text-sm">
          <div class="grid place-items-center rounded-xl text-slate-500">单品查询</div>
          <div class="grid place-items-center rounded-xl text-slate-500">供应商查询</div>
          <div class="grid place-items-center rounded-xl bg-white font-medium text-teal-800 shadow-sm">柜组查询</div>
        </div>

        <section class="overflow-hidden rounded-3xl border-0 bg-gradient-to-br from-teal-700 to-emerald-800 text-white shadow-lg">
          <div class="p-5">
            <div class="text-xs text-teal-100">已选柜组</div>
            <div class="mt-1 text-lg font-semibold leading-7">[6010101027] Christian dior迪奥厅</div>
            <div class="mt-4 grid grid-cols-2 gap-2">
              <div class="rounded-2xl bg-white/10 p-3">
                <div class="text-xs text-teal-100">库存数量</div>
                <div class="mt-1 text-2xl font-bold tabular-nums">6,751.0000</div>
              </div>
              <div class="rounded-2xl bg-white/10 p-3">
                <div class="text-xs text-teal-100">库存明细</div>
                <div class="mt-1 text-2xl font-bold tabular-nums">183</div>
              </div>
              <div class="col-span-2 flex items-center justify-between rounded-2xl bg-white/10 px-3 py-2.5">
                <div>
                  <div class="text-xs text-teal-100">总库存金额</div>
                  <div class="mt-0.5 text-[10px] text-teal-100/80">按零售价合计</div>
                </div>
                <div class="text-xl font-bold tabular-nums">¥1,356,882.00</div>
              </div>
            </div>
          </div>
        </section>

        <section class="space-y-3">
          <article class="overflow-hidden rounded-2xl border-0 bg-white shadow-sm">
            <header class="space-y-1 border-b bg-teal-50 px-4 py-3">
              <h2 class="text-sm font-semibold leading-5 text-teal-950">[00070] 路威酩轩香水化妆品(上海)有限公司</h2>
              <p class="text-[11px] leading-4 text-slate-500">183 条明细 · 库存数量 6,751.0000</p>
            </header>
            <div id="inventory-rows" class="divide-y"></div>
          </article>
        </section>
      </div>
    </main>

    <script>
      const rows = [
        ["迪奥雪晶灵防晒妆前乳", "2006027", "2000020060273", "77.0000", "¥590.00 × 77.0000 = ¥45,430.00"],
        ["迪奥真我香水", "2001886", "2000020018869", "32.0000", "¥1,260.00 × 32.0000 = ¥40,320.00"],
        ["迪奥烈艳蓝金唇膏", "2003180", "2000020031806", "51.0000", "¥390.00 × 51.0000 = ¥19,890.00"],
        ["迪奥凝脂恒久气垫粉底", "2007421", "2000020074218", "28.0000", "¥650.00 × 28.0000 = ¥18,200.00"],
        ["迪奥花秘瑰萃精华", "2009635", "2000020096357", "18.0000", "¥2,350.00 × 18.0000 = ¥42,300.00"],
        ["迪奥锁妆粉底液", "2005472", "2000020054722", "46.0000", "¥620.00 × 46.0000 = ¥28,520.00"],
        ["迪奥小姐花漾淡香水", "2002719", "2000020027199", "39.0000", "¥980.00 × 39.0000 = ¥38,220.00"],
      ];

      document.querySelector("#inventory-rows").innerHTML = rows.map(([name, code, barcode, quantity, price]) => `
        <div class="px-3 py-2.5">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0">
              <div class="text-sm font-semibold leading-5 text-slate-900">${name}</div>
              <div class="mt-0.5 break-all text-[11px] leading-4 text-slate-500">商品 ${code} · 条码 ${barcode}</div>
            </div>
            <div class="shrink-0 rounded-lg bg-emerald-50 px-2 py-1 text-right text-emerald-700">
              <div class="text-[9px] leading-3">库存数量</div>
              <div class="text-sm font-bold leading-5 tabular-nums">${quantity}</div>
            </div>
          </div>
          <div class="mt-1.5 flex flex-wrap gap-x-2 text-[11px] leading-4 text-slate-500">
            <span>子库存：正常库存</span><span>售价：${price}</span>
          </div>
        </div>
      `).join("");
    </script>
  </body>
</html>

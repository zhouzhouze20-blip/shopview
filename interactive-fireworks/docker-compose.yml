name: interactive-fireworks

services:
  fireworks:
    image: interactive-fireworks:0.2.2
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8787"
      APP_VERSION: "0.2.2"
      DATABASE_PATH: /app/data/wishes.db
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:?请在 .env 中设置 PUBLIC_BASE_URL}"
      ADMIN_TOKEN: "${ADMIN_TOKEN:?请在 .env 中设置 ADMIN_TOKEN}"
    ports:
      - "${FIREWORKS_BIND_IP:-127.0.0.1}:${FIREWORKS_PORT:-8787}:8787"
    volumes:
      - fireworks_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8787/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  fireworks_data:
